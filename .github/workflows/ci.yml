name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: build
      run: make build

    - name: lint
      uses: golangci/golangci-lint-action@v8

    - name: Coveralls
      uses: coverallsapp/github-action@v2
